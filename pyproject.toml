name = ""Explainable-Credit-Risk-Platform""
version = ""0.1.0""
description = ""Explainable and fair credit risk prediction with SHAP, LIME, DiCE and Fairlearn""
readme = ""README.md""
requires-python = "">=3.10""
authors = [
  {name = ""Engr-Talha-Nazir""}
]
license = {text = ""MIT""}
keywords = [""xai"", ""explainability"", ""fairness"", ""credit risk"", ""shap"", ""lime"", ""dice"", ""fairlearn"", ""xgboost""]
classifiers = [
  ""Development Status :: 3 - Alpha"",
  ""Intended Audience :: Science/Research"",
  ""License :: OSI Approved :: MIT License"",
  ""Programming Language :: Python :: 3.10"",
  ""Programming Language :: Python :: 3.11"",
  ""Topic :: Scientific/Engineering :: Artificial Intelligence""
]

[project.urls]
Repository = ""https://github.com/Engr-Talha-Nazir/Explainable-Credit-Risk-Platform""
Issues = ""https://github.com/Engr-Talha-Nazir/Explainable-Credit-Risk-Platform/issues""

[build-system]
requires = [""setuptools>=65.0"", ""wheel""]
build-backend = ""setuptools.build_meta""

[tool.setuptools.packages.find]
where = ["".""]
include = [""src*""]
namespaces = false

[tool.black]
line-length = 88
target-version = [""py310"", ""py311""]
include = "".pyi?$""

[tool.isort]
profile = ""black""
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 88
target-version = ""py310""
select = [
  ""E"", ""F"", ""I"", ""N"", ""UP"", ""B"", ""A"", ""C4"", ""DTZ"", ""T10"", ""EM"", ""G"", ""PIE"", ""T20"", ""PT"", ""Q"", ""RSE"", ""RET"", ""SIM"", ""TID"", ""ARG"", ""PTH"", ""ERA"", ""PL"", ""RUF""
]
ignore = [
  ""E501"",  # line too long (handled by black)
  ""PLR0913"", ""PLR0912"", ""PLR0915"",  # complexity
  ""RUF001"", ""RUF002"", ""RUF003""  # unicode
]

[tool.ruff.per-file-ignores]
""tests/*"" = [""PLR2004"", ""S101"", ""ARG"", ""PT011""]
""notebooks/*"" = [""T201"", ""E402"", ""F401""]
""src/dashboard/*"" = [""T201""]
""src/api/*"" = [""B008""]

[tool.mypy]
python_version = ""3.10""
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundancy = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
namespace_packages = true
mypy_path = ""src""

[[tool.mypy.overrides]]
module = [
  ""shap.*"", ""lime.*"", ""dice_ml.*"", ""fairlearn.*"",
  ""sklearn.*"", ""xgboost.*"", ""streamlit.*"", ""pandas.*"", ""numpy.*""
]
ignore_missing_imports = true
